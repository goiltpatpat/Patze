name: Check Patpat Skills

on:
  schedule:
    # Run automatically every day at 04:00 UTC
    - cron: '0 4 * * *'
  repository_dispatch:
    types: [patpat-updated]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-skills:
    name: Check pinned Patpat skills and upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pinned portable skills
        run: python3 scripts/verify_patpat_skills.py

      - name: Check upstream Patpat revision
        run: |
          pinned="$(git rev-parse HEAD:plugins/patpat)"
          git submodule update --remote plugins/patpat
          upstream="$(git -C plugins/patpat rev-parse HEAD)"
          if [ "$pinned" != "$upstream" ]; then
            echo "::error::Patpat upstream advanced from $pinned to $upstream. Run pnpm update-skills and submit the reviewed change through a PR."
            exit 1
          fi
          echo "Patpat upstream matches the pinned revision."
